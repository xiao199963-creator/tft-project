services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tft_meta
      POSTGRES_USER: tft
      POSTGRES_PASSWORD: tft
    ports:
      - "5432:5432"
  api:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tft:tft@db:5432/tft_meta
    depends_on:
      - db
  web:
    build: ./apps/web
    command: npm run dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
